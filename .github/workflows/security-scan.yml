name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2

  python-security:
    name: Python security checks
    runs-on: ubuntu-latest
    needs: codeql
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run pip-audit (dependency scan)
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt --format=json > pip_audit.json || true; else pip-audit --format=json > pip_audit.json || true; fi

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip_audit.json

      - name: Run Bandit (SAST for Python)
        run: |
          bandit -r . -f json -o bandit.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.json

      - name: Fail on HIGH Bandit issues
        run: |
          python - <<'PY'
          import json,sys
          try:
              data=json.load(open('bandit.json'))
          except Exception:
              print('No bandit.json found or empty')
              sys.exit(0)
          for r in data.get('results',[]):
              if r.get('issue_severity','').upper() == 'HIGH':
                  print('Bandit HIGH issue:', r.get('issue_text'))
                  sys.exit(1)
          print('No HIGH bandit issues')
          PY
