name: Detect and Generate Lookups

on:
  push:
    paths:
      - "input/files/**"
      - "lookups/**"
      - "metadata/**"
      - "schema/**"
      - "mapping/**"
      - "config/deployment.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "input/files/**"
      - "lookups/**"
      - "metadata/**"
      - "schema/**"
      - "mapping/**"
      - "config/deployment.yaml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lookup-pipeline-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect affected lookup IDs
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      lookup_ids_json: ${{ steps.detect.outputs.lookup_ids_json }}
      lookup_count: ${{ steps.detect.outputs.lookup_count }}
      lookup_modes_json: ${{ steps.detect.outputs.lookup_modes_json }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Determine comparison SHAs
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Get changed files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > all_changed_files.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > all_changed_files.txt
          fi
          grep -E '^(input/files/|lookups/|metadata/|schema/|mapping/)' all_changed_files.txt > changed_files.txt || true
          echo "Changed lookup files:"
          cat changed_files.txt || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Detect lookup IDs and generation mode
        id: detect
        env:
          BASE_SHA: ${{ env.BASE_SHA }}
        run: python src/detect_lookup.py

      - name: Show detection result
        run: |
          echo "Lookup IDs: ${{ steps.detect.outputs.lookup_ids_json }}"
          echo "Count:      ${{ steps.detect.outputs.lookup_count }}"
          echo "Lookup modes: ${{ steps.detect.outputs.lookup_modes_json }}"

  generate:
    name: Generate canonical and SIEM targets
    needs: detect
    if: ${{ needs.detect.result == 'success' && needs.detect.outputs.lookup_count != '0' }}
    uses: ./.github/workflows/generate-lookups.yml
    with:
      lookup_ids_json: ${{ needs.detect.outputs.lookup_ids_json }}
      lookup_modes_json: ${{ needs.detect.outputs.lookup_modes_json }}
    secrets: inherit
